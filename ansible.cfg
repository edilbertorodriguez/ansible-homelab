[defaults]
inventory = inventories/homelab/hosts.yml
roles_path = roles

host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

stdout_callback = yaml
timeout = 30

forks = 10
gathering = smart
fact_caching = memory

[inventory]
enable_plugins = yaml

[ssh_connection]
pipelining = True
scp_if_ssh = True
