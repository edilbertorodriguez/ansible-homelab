---
###############################################################################
# Security role defaults
###############################################################################

###############################################################################
# Feature flags
###############################################################################

# Install shared baseline security packages.
security_manage_packages: false

# Configure automatic security updates.
security_manage_unattended_upgrades: true

# Configure Fail2ban.
security_manage_fail2ban: false

# Configure Linux auditing.
security_manage_auditd: false

# Configure time synchronization.
security_manage_chrony: false

# Apply kernel and network hardening.
security_manage_sysctl: false

# Configure the host firewall.
security_manage_firewall: false

###############################################################################
# Package configuration
###############################################################################

# Packages required for unattended security updates.
security_unattended_packages:
  - unattended-upgrades
  - apt-listchanges

# Optional shared security packages.
#
# Keep this list empty by default. Individual security features should install
# their own required packages. Populate this list only if you want additional
# common security utilities installed regardless of enabled features.
security_packages: []

###############################################################################
# Auditd configuration
###############################################################################

# Packages required for Linux auditing.
security_auditd_packages:
  - auditd

# Managed audit rules.
#
# These rules monitor changes to identity files, privilege configuration,
# SSH configuration, and audit logs. They also record file deletion activity
# performed by interactive users.
security_auditd_rules:
  - "-w /etc/passwd -p wa -k identity"
  - "-w /etc/group -p wa -k identity"
  - "-w /etc/shadow -p wa -k identity"
  - "-w /etc/gshadow -p wa -k identity"
  - "-w /etc/sudoers -p wa -k privilege_scope"
  - "-w /etc/sudoers.d/ -p wa -k privilege_scope"
  - "-w /etc/ssh/sshd_config -p wa -k ssh_configuration"
  - "-w /var/log/audit/ -p wa -k audit_logs"
  - "-a always,exit -F arch=b64 -S unlink,unlinkat,rename,renameat -F auid>=1000 -F auid!=unset -k file_deletion"
  - "-a always,exit -F arch=b32 -S unlink,unlinkat,rename,renameat -F auid>=1000 -F auid!=unset -k file_deletion"
