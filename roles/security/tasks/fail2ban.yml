---
###############################################################################
# Configure Fail2ban
###############################################################################

- name: Install Fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deploy Fail2ban SSH jail configuration
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      port = ssh
      backend = systemd
      maxretry = 5
      findtime = 10m
      bantime = 1h
  notify: Restart Fail2ban

- name: Ensure Fail2ban is enabled and running
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when:
    - not ansible_check_mode
