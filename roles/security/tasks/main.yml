---
###############################################################################
# Security role task orchestration
###############################################################################

- name: Validate security role configuration
  ansible.builtin.import_tasks: validation.yml

- name: Install baseline security packages
  ansible.builtin.import_tasks: packages.yml
  when:
    - security_manage_packages | bool

- name: Configure unattended security updates
  ansible.builtin.import_tasks: unattended_upgrades.yml
  when:
    - security_manage_unattended_upgrades | bool

- name: Configure Fail2ban
  ansible.builtin.import_tasks: fail2ban.yml
  when:
    - security_manage_fail2ban | bool
