---
###############################################################################
# Common Role Defaults
#
# Default variables applied to all managed Linux hosts.
###############################################################################

common_packages:
  - curl
  - git
  - vim
  - htop
  - btop
  - unzip
  - zip
  - wget
  - rsync
  - tree
  - net-tools
  - dnsutils
  - ca-certificates
  - bash-completion

common_update_cache: true
common_upgrade_packages: false

###############################################################################
# Hostname Management
###############################################################################

common_manage_hostname: false
common_hostname: "{{ inventory_hostname }}"

###############################################################################
# Timezone Management
###############################################################################

common_manage_timezone: false
common_system_timezone: UTC
