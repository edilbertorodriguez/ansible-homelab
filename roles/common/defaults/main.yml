---
###############################################################################
# Common Role Defaults
#
# Default variables applied to all managed Linux hosts.
###############################################################################

common_packages:
  - curl
  - git
  - vim
  - htop
  - btop
  - unzip
  - zip
  - wget
  - rsync
  - tree
  - net-tools
  - dnsutils
  - ca-certificates
  - bash-completion

common_update_cache: true
common_upgrade_packages: false

###############################################################################
# Hostname Management
###############################################################################

common_manage_hostname: false
common_hostname: "{{ inventory_hostname }}"

###############################################################################
# Timezone Management
###############################################################################

common_manage_timezone: false
common_system_timezone: UTC

###############################################################################
# SSH Daemon Configuration
###############################################################################

# Enable SSH configuration management.
common_manage_sshd: false

# Listening configuration.
common_sshd_port: 22

# Authentication.
common_sshd_permit_root_login: "no"
common_sshd_password_authentication: "yes"
common_sshd_pubkey_authentication: "yes"

# Session management.
common_sshd_x11_forwarding: "no"
common_sshd_client_alive_interval: 300
common_sshd_client_alive_count_max: 2
