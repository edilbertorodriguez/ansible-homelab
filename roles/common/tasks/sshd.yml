---
###############################################################################
# SSH Daemon Configuration
#
# Deploy and validate the managed OpenSSH server configuration.
###############################################################################

- name: Ensure SSH configuration drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: common_manage_sshd | bool
  tags:
    - common
    - ssh
    - security

- name: Deploy hardened SSH daemon configuration
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config.d/99-ansible.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Restart SSH service
  when: common_manage_sshd | bool
  tags:
    - common
    - ssh
    - security
