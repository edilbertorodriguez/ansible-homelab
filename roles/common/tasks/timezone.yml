---
###############################################################################
# Timezone Management
#
# Configure the system timezone using systemd timedatectl.
###############################################################################

- name: Get current timezone
  ansible.builtin.command: timedatectl show --property=Timezone --value
  register: current_timezone
  changed_when: false
  when: common_manage_timezone | bool

- name: Configure system timezone
  ansible.builtin.command:
    cmd: "timedatectl set-timezone {{ common_system_timezone }}"
  when:
    - common_manage_timezone | bool
    - current_timezone.stdout != common_system_timezone
  tags:
    - common
    - timezone
