---
###############################################################################
# Package Management Tasks
#
# Update package metadata, optionally upgrade installed packages,
# and ensure the baseline package set is installed.
###############################################################################

- name: Update APT package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: common_update_cache | bool
  tags:
    - common
    - packages
    - updates

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: dist
  when: common_upgrade_packages | bool
  tags:
    - common
    - packages
    - upgrades

- name: Install common system packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  tags:
    - common
    - packages
