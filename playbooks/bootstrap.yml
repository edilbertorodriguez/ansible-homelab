---
###############################################################################
# Bootstrap Infrastructure
#
# Purpose:
#   Prepare every managed Linux system with the common baseline configuration.
#
# Future roles:
#   - common
#   - users
#   - security
#   - monitoring
###############################################################################

- name: Bootstrap Linux Infrastructure
  hosts: linux
  become: true
  gather_facts: true

  roles:
    - role: common

    - role: users

    - role: security
